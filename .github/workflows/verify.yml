name: verify

# Every claim in the README runs against the released Opaque package, on a
# schedule, so the quickstart cannot rot. The CI run uses the insecure
# auto-approve backend; the transcript must show its audit attribution.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  quickstart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          # Opaque 0.4.0 applies its network-deny seccomp filter to bwrap
          # itself, so bwrap cannot bind the NETLINK_ROUTE socket it needs to
          # configure loopback in the new network namespace: every
          # sandbox.exec under a no-network profile fails on Linux when
          # bubblewrap is present (reported upstream). Keep bwrap absent so
          # the daemon selects its unshare + landlock + seccomp fallback;
          # reinstall bubblewrap here once the fix ships.
          sudo apt-get remove -y bubblewrap || true
          if command -v bwrap >/dev/null 2>&1; then
            echo 'bwrap still present; the daemon would pick the broken path' >&2
            exit 1
          fi
          # The unshare fallback still needs unprivileged user namespaces,
          # which ubuntu-24.04 runners restrict via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Opaque (released package)
        env:
          # Pin the release: deterministic, and skips the unauthenticated
          # GitHub API latest-release lookup that rate-limits on shared
          # runners. Bump on new Opaque releases.
          OPAQUE_VERSION: "0.4.0"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL https://raw.githubusercontent.com/kcirtapfromspace/opaque/main/install.sh \
            | OPAQUE_INSTALL="$RUNNER_TEMP/bin" sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          opaque --version
          opaqued --version

      - name: Regenerate the synthetic data and check determinism
        run: |
          set -euo pipefail
          python3 data/generate.py
          git diff --exit-code data/loan_applications.csv

      - name: Run the quickstart (CI mode)
        run: |
          set -euo pipefail
          HARBORLIGHT_LOG_COPY="$PWD/opaqued.log" ./quickstart.sh --ci 2>&1 | tee transcript.txt

      - name: Assert the story happened
        run: |
          set -euo pipefail
          grep -F 'ALLOW (rule: allow-test-noop)' transcript.txt
          grep -F 'DENY: no matching policy rule' transcript.txt
          grep -F 'demo_value_123456' transcript.txt
          grep -F 'unavailable (0 samples)' transcript.txt
          grep -F 'Sandbox exec succeeded' transcript.txt
          grep -F 'code: policy_denied' transcript.txt
          grep -F 'Audit chain intact' transcript.txt
          grep -F 'TAMPER DETECTED' transcript.txt
          grep -F 'insecure_backend_active' transcript.txt

      - name: Diagnose on failure
        if: failure()
        run: |
          echo '--- direct analyst run, unsandboxed (dummy token) ---'
          HARBORLIGHT_SOURCE_TOKEN=demo_value_123456 python3 agent/analyst.py report \
            || echo "direct run exit: $?"
          echo '--- bubblewrap probe ---'
          if command -v bwrap >/dev/null 2>&1; then
            bwrap --version || true
            bwrap --ro-bind / / --dev /dev --proc /proc /bin/true \
              && echo 'bwrap basic sandbox OK' \
              || echo "bwrap basic sandbox FAILED: $?"
          else
            echo 'bwrap not present'
          fi
          echo '--- daemon log tail ---'
          tail -60 opaqued.log 2>/dev/null || echo 'no daemon log captured'
          if command -v bwrap >/dev/null 2>&1; then
            echo '--- replicate opaqued bwrap invocation (stderr visible) ---'
            PY="$(python3 -c 'import sys; print(sys.executable)')"
            BWARGS=(--ro-bind / / --dev /dev --proc /proc
                    --bind "$PWD" "$PWD" --tmpfs /tmp
                    --unshare-pid --unshare-net --die-with-parent --new-session --)
            echo "[plain bwrap]"
            HARBORLIGHT_SOURCE_TOKEN=demo_value_123456 \
              bwrap "${BWARGS[@]}" "$PY" "$PWD/agent/analyst.py" report \
              && echo 'plain bwrap OK' || echo "plain bwrap exit: $?"
            echo "[bwrap under NO_NEW_PRIVS, as opaqued runs it]"
            HARBORLIGHT_SOURCE_TOKEN=demo_value_123456 \
              setpriv --no-new-privs bwrap "${BWARGS[@]}" "$PY" "$PWD/agent/analyst.py" report \
              && echo 'nnp bwrap OK' || echo "nnp bwrap exit: $?"
          fi
          echo '--- layer isolation: sandbox variants through the daemon ---'
          (
            set -euo pipefail
            export OPAQUE_QUICKSTART_CI=1 HARBORLIGHT_KEEP=1
            source acts/_lib.sh
            harborlight_env
            ensure_initialized
            sed "s|__REPO_DIR__|$HARBORLIGHT_REPO|; s|name = \"analyst\"|name = \"netallow\"|; s|allow = \[\]|allow = [\"127.0.0.1:9\"]|" \
              profiles/analyst.toml > "$HOME/.opaque/profiles/netallow.toml"
            sed "s|__REPO_DIR__|$HARBORLIGHT_REPO|; s|name = \"analyst\"|name = \"nosandbox\"\nsandbox = false|" \
              profiles/analyst.toml > "$HOME/.opaque/profiles/nosandbox.toml"
            start_daemon
            PY="$(resolve_analyst_python)"
            echo '[netallow: real sandbox, network allow non-empty]'
            opaque exec --profile netallow -- "$PY" "$HARBORLIGHT_REPO/agent/analyst.py" report || true
            echo '[nosandbox: platform sandbox disabled, broker path intact]'
            opaque exec --profile nosandbox -- "$PY" "$HARBORLIGHT_REPO/agent/analyst.py" report || true
            echo '[daemon log tail]'
            tail -25 "$HARBORLIGHT_DIR/logs/opaqued.log" || true
            stop_daemon || true
          ) || echo 'layer isolation probe failed'

      - name: Upload transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ matrix.os }}
          path: |
            transcript.txt
            opaqued.log
